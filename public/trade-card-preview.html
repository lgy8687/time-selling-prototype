<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f7f3" />
    <title>我的交易 · 卡片交互预览</title>
    <style>
      :root {
        font-family:
          -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei",
          sans-serif;
        color: #20372a;
        background: #eef2ec;
        font-synthesis: none;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid #94c8a3;
        outline-offset: 3px;
      }
      .preview-shell {
        max-width: 440px;
        min-height: 100vh;
        margin: 0 auto;
        padding: 20px 16px 34px;
        background: #f6f8f5;
      }
      .preview-caption {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        color: #718879;
        font-size: 12px;
      }
      .preview-caption strong {
        color: #246a4d;
        font-size: 12px;
      }
      .profile {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 25px 0 22px;
      }
      .avatar {
        display: grid;
        place-items: center;
        flex: none;
        width: 48px;
        height: 48px;
        border-radius: 15px;
        background: #dceedd;
        color: #256b4b;
        font-size: 20px;
        font-weight: 800;
      }
      .profile-copy {
        flex: 1;
        min-width: 0;
      }
      .profile h1 {
        margin: 0 0 4px;
        font-size: 23px;
        line-height: 1.2;
      }
      .profile p {
        margin: 0;
        color: #819486;
        font-size: 11px;
      }
      .profile-mark {
        color: #7b9680;
        font-size: 20px;
      }
      .switch-label {
        margin: 0 0 9px;
        color: #77917d;
        font-size: 11px;
        font-weight: 700;
      }
      .variant-switch {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
        padding: 4px;
        margin: 0 0 18px;
        border-radius: 12px;
        background: #e8eee7;
      }
      .variant-switch button {
        min-height: 37px;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: #718678;
        font-size: 12px;
        font-weight: 700;
      }
      .variant-switch button[aria-pressed="true"] {
        background: white;
        color: #21694b;
        box-shadow: 0 2px 10px #244a2615;
      }
      .surface {
        padding: 18px 17px 19px;
        margin-bottom: 12px;
        border: 1px solid #e6ece5;
        border-radius: 17px;
        background: white;
        box-shadow: 0 8px 25px #14332208;
      }
      .surface-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
      }
      .surface-head h2 {
        margin: 0;
        font-size: 17px;
      }
      .surface-head .link {
        border: 0;
        background: transparent;
        color: #8ca090;
        font-size: 11px;
        white-space: nowrap;
      }
      .entry-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 4px;
        margin-top: 20px;
      }
      .entry {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        gap: 9px;
        min-height: 62px;
        padding: 2px 0;
        border: 0;
        border-radius: 10px;
        background: transparent;
        color: #283b30;
        font-size: 11px;
        font-weight: 700;
        white-space: nowrap;
      }
      .entry:hover,
      .entry:focus-visible {
        background: #f0f6ef;
      }
      .icon {
        width: 24px;
        height: 24px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .tools .icon {
        color: #3c8660;
      }
      .pair {
        display: grid;
        grid-template-columns: 1fr 1fr;
        margin-top: 17px;
      }
      .pair button {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
        min-height: 82px;
        padding: 9px 12px;
        border: 0;
        background: transparent;
        text-align: left;
      }
      .pair button:first-child {
        border-right: 1px solid #e8eee7;
      }
      .pair button:hover {
        background: #f4f8f3;
      }
      .pair-title {
        display: flex;
        align-items: center;
        gap: 6px;
        color: #244a34;
        font-size: 13px;
        font-weight: 800;
      }
      .pair-title .icon {
        width: 20px;
        height: 20px;
        color: #397c57;
      }
      .pair small {
        color: #869989;
        font-size: 10px;
      }
      .action-row {
        display: flex;
        justify-content: space-between;
        width: 100%;
        padding: 13px 10px 2px;
        margin-top: 12px;
        border: 0;
        border-top: 1px solid #e8eee7;
        background: transparent;
        color: #286f50;
        font-size: 12px;
        font-weight: 700;
        text-align: left;
      }
      .design-note {
        margin: 16px 3px 0;
        color: #788b7c;
        font-size: 11px;
        line-height: 1.65;
      }
      .overlay {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding: 15px;
        background: #15291e88;
      }
      .overlay[hidden],
      .variant[hidden] {
        display: none;
      }
      .sheet {
        width: min(100%, 440px);
        padding: 23px;
        border-radius: 19px;
        background: white;
        box-shadow: 0 18px 55px #10281a2b;
      }
      .sheet-top {
        display: flex;
        justify-content: space-between;
        align-items: start;
        gap: 10px;
      }
      .sheet-kicker {
        color: #488160;
        font-size: 11px;
        font-weight: 700;
      }
      .sheet h2 {
        margin: 7px 0 8px;
        font-size: 21px;
      }
      .sheet p {
        margin: 0;
        color: #74887b;
        font-size: 12px;
        line-height: 1.75;
      }
      .close {
        width: 32px;
        height: 32px;
        border: 0;
        border-radius: 9px;
        background: #eef4ed;
        color: #47735a;
        font-size: 20px;
      }
      .sheet-tag {
        display: inline-block;
        margin-top: 19px;
        padding: 7px 10px;
        border-radius: 8px;
        background: #edf5ed;
        color: #467357;
        font-size: 11px;
      }
      @media (max-width: 355px) {
        .preview-shell {
          padding-inline: 10px;
        }
        .surface {
          padding-inline: 12px;
        }
        .entry {
          font-size: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="preview-shell" data-b="B25">
      <div class="preview-caption">
        <strong>时间售卖</strong><span>「我的」卡片交互预览 · 非正式页面</span>
      </div>
      <header class="profile">
        <span class="avatar">我</span>
        <div class="profile-copy">
          <h1>我的</h1>
          <p>一个账户 · 可以购买，也可以分享</p>
        </div>
        <span class="profile-mark" aria-hidden="true">◌</span>
      </header>
      <p class="switch-label">比较两种排列方式</p>
      <div class="variant-switch" role="group" aria-label="布局方案">
        <button
          type="button"
          data-variant-button="four"
          aria-pressed="true"
          data-z="Z25-1"
        >
          四入口交易卡
        </button>
        <button
          type="button"
          data-variant-button="pair"
          aria-pressed="false"
          data-z="Z25-2"
        >
          双向交易卡
        </button>
      </div>
      <div class="variant" data-variant="four">
        <section class="surface" aria-label="我的交易">
          <div class="surface-head">
            <h2>我的交易</h2>
            <button class="link" type="button" data-detail="all" data-z="Z25-3">
              全部记录 ›
            </button>
          </div>
          <div class="entry-grid">
            <button
              class="entry"
              type="button"
              data-detail="bought"
              data-z="Z25-4"
            >
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 8h16l-1 13H5L4 8Z" />
                <path d="M8 9V6a4 4 0 0 1 8 0v3" /></svg
              ><span>我买到的</span>
            </button>
            <button
              class="entry"
              type="button"
              data-detail="sold"
              data-z="Z25-5"
            >
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 3h14v18l-3-2-4 2-4-2-3 2V3Z" />
                <path d="M8 8h8M8 12h6" /></svg
              ><span>我卖出的</span>
            </button>
            <button
              class="entry"
              type="button"
              data-detail="published"
              data-z="Z25-6"
            >
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 11V4a1 1 0 0 1 1-1h7l10 10-8 8L3 11Z" />
                <circle cx="7.5" cy="7.5" r="1" /></svg
              ><span>我的发布</span>
            </button>
            <button
              class="entry"
              type="button"
              data-detail="pending"
              data-z="Z25-7"
            >
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="5" width="18" height="16" rx="2" />
                <path d="M7 3v4M17 3v4M3 10h18M12 13v4l2 1" /></svg
              ><span>待我处理</span>
            </button>
          </div>
        </section>
        <section class="surface tools" aria-label="常用工具">
          <div class="surface-head"><h2>常用工具</h2></div>
          <div class="entry-grid">
            <button
              class="entry"
              type="button"
              data-detail="schedule"
              data-z="Z25-8"
            >
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="5" width="18" height="16" rx="2" />
                <path d="M7 3v4M17 3v4M3 10h18" /></svg
              ><span>时间表</span>
            </button>
            <button
              class="entry"
              type="button"
              data-detail="slots"
              data-z="Z25-9"
            >
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="9" />
                <path d="M12 7v5l3 2" /></svg
              ><span>开放时间</span>
            </button>
            <button
              class="entry"
              type="button"
              data-detail="materials"
              data-z="Z25-10"
            >
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M3 6a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6Z"
                /></svg
              ><span>交流资料</span>
            </button>
            <button
              class="entry"
              type="button"
              data-detail="saved"
              data-z="Z25-11"
            >
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M20 8c0 5-8 11-8 11S4 13 4 8a4.5 4.5 0 0 1 8-3 4.5 4.5 0 0 1 8 3Z"
                /></svg
              ><span>收藏</span>
            </button>
          </div>
        </section>
        <p class="design-note">
          首页保留四个交易入口；预约与订单的详细状态，进入后再看。
        </p>
      </div>
      <div class="variant" data-variant="pair" hidden>
        <section class="surface" aria-label="我的交易">
          <div class="surface-head">
            <h2>我的交易</h2>
            <button
              class="link"
              type="button"
              data-detail="all"
              data-z="Z25-12"
            >
              全部记录 ›
            </button>
          </div>
          <div class="pair">
            <button type="button" data-detail="bought" data-z="Z25-13">
              <span class="pair-title">我买到的</span
              ><small>订单 · 预约 · 售后</small>
            </button>
            <button type="button" data-detail="sold" data-z="Z25-14">
              <span class="pair-title">我卖出的</span
              ><small>意向 · 服务 · 收入</small>
            </button>
          </div>
          <button
            class="action-row"
            type="button"
            data-detail="pending"
            data-z="Z25-15"
          >
            <span>待我处理的预约</span><span>查看 ›</span>
          </button>
        </section>
        <section class="surface tools" aria-label="常用工具">
          <div class="surface-head"><h2>常用工具</h2></div>
          <div class="entry-grid">
            <button
              class="entry"
              type="button"
              data-detail="published"
              data-z="Z25-16"
            >
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 11V4a1 1 0 0 1 1-1h7l10 10-8 8L3 11Z" />
                <circle cx="7.5" cy="7.5" r="1" /></svg
              ><span>我的发布</span>
            </button>
            <button
              class="entry"
              type="button"
              data-detail="schedule"
              data-z="Z25-17"
            >
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="5" width="18" height="16" rx="2" />
                <path d="M7 3v4M17 3v4M3 10h18" /></svg
              ><span>时间表</span>
            </button>
            <button
              class="entry"
              type="button"
              data-detail="materials"
              data-z="Z25-18"
            >
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M3 6a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6Z"
                /></svg
              ><span>交流资料</span>
            </button>
            <button
              class="entry"
              type="button"
              data-detail="saved"
              data-z="Z25-19"
            >
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M20 8c0 5-8 11-8 11S4 13 4 8a4.5 4.5 0 0 1 8-3 4.5 4.5 0 0 1 8 3Z"
                /></svg
              ><span>收藏</span>
            </button>
          </div>
        </section>
        <p class="design-note">买卖两侧更突出，但发布入口会下移到工具区。</p>
      </div>
    </div>
    <div class="overlay" id="detail-overlay" hidden>
      <div
        class="sheet"
        role="dialog"
        aria-modal="true"
        aria-labelledby="detail-title"
      >
        <div class="sheet-top">
          <div>
            <span class="sheet-kicker">卡片点击预览</span>
            <h2 id="detail-title"></h2>
          </div>
          <button
            class="close"
            type="button"
            id="close-detail"
            aria-label="关闭"
            data-z="Z25-20"
          >
            ×
          </button>
        </div>
        <p id="detail-copy"></p>
        <span class="sheet-tag">这是布局演示，没有真实交易数据</span>
      </div>
    </div>
    <script>
      const details = {
        all: [
          "全部记录",
          "集中查看买入和卖出记录；进入后再按交易方向与状态筛选。",
        ],
        bought: [
          "我买到的",
          "查看自己预约或购买的服务、进度，以及对方交付的资料。",
        ],
        sold: [
          "我卖出的",
          "查看自己提供的服务、预约意向和未来产生的交易记录。预约意向不会算作成交。",
        ],
        published: ["我的发布", "管理服务草稿与未来上架的服务内容。"],
        pending: [
          "待我处理",
          "把需要行动的预约意向、改期请求和订单事项汇总到这里。",
        ],
        schedule: ["时间表", "查看已安排、私人占用和自己主动开放的时段。"],
        slots: ["开放时间", "快速进入时间表中愿意对外展示的可约时段。"],
        materials: [
          "交流资料",
          "管理自己准备分享的资料，或查看购买服务后收到的资料。",
        ],
        saved: ["收藏", "保留感兴趣的人与服务；这项功能仍在规划中。"],
      };
      const overlay = document.getElementById("detail-overlay");
      const title = document.getElementById("detail-title");
      const copy = document.getElementById("detail-copy");
      let lastTrigger = null;
      document.querySelectorAll("[data-variant-button]").forEach((button) => {
        button.addEventListener("click", () => {
          const next = button.dataset.variantButton;
          document
            .querySelectorAll("[data-variant-button]")
            .forEach((item) =>
              item.setAttribute("aria-pressed", String(item === button)),
            );
          document.querySelectorAll(".variant").forEach((item) => {
            item.hidden = item.dataset.variant !== next;
          });
        });
      });
      document.querySelectorAll("[data-detail]").forEach((button) => {
        button.addEventListener("click", () => {
          lastTrigger = button;
          const [heading, description] = details[button.dataset.detail];
          title.textContent = heading;
          copy.textContent = description;
          overlay.hidden = false;
          document.getElementById("close-detail").focus();
        });
      });
      function closeDetail() {
        overlay.hidden = true;
        lastTrigger?.focus();
      }
      document
        .getElementById("close-detail")
        .addEventListener("click", closeDetail);
      overlay.addEventListener("click", (event) => {
        if (event.target === overlay) closeDetail();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !overlay.hidden) closeDetail();
      });
    </script>
  </body>
</html>
